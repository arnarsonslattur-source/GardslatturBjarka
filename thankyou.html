<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <title>Takk!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #ececec;
      text-align: center;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>🎉 Takk fyrir!</h1>
    <p>Við höfum móttekið beiðnina þína og höfum samband fljótlega.</p>
    <a href="index.html">Til baka á heimasíðu</a>
  </div>

</body>
</html>
